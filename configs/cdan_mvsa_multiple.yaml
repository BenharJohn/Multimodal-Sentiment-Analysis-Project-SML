# CDAN Model Configuration for MVSA-Multiple Dataset
# Extends base config with soft labels and specific settings for multiple annotations

# Inherit from base
experiment_name: cdan_mvsa_multiple
seed: 42

# Data - MVSA-Multiple specific
dataset_type: multiple  # Multiple annotations per sample
data_dir: data/processed/mvsa_multiple
image_dir: data/raw/images
use_soft_labels: true  # Use label distribution instead of majority vote

# Model Architecture (same as base)
clip_model_name: openai/clip-vit-base-patch32
num_classes: 3
freeze_clip: true

# Cross-Attention
cross_attn_layers: 2
cross_attn_heads: 8
cross_attn_dropout: 0.1
pool_method: mean

# Gating
use_gating: true
gate_type: simple
gate_activation: sigmoid

# Auxiliary Decoder
use_aux_decoder: true
aux_loss_weight: 0.05
aux_loss_type: cosine
aux_num_layers: 2

# Classifier
classifier_hidden_dims: [512, 256]
classifier_dropout: 0.3

# Training - adjusted for noisy labels
epochs: 40  # More epochs for noisy labels
batch_size: 32
num_workers: 4
pin_memory: true

# Optimization
lr: 0.001
clip_lr: 0.00001
weight_decay: 0.01
optimizer: adamw
scheduler: cosine
gradient_clip: 1.0

# CLIP Freezing
freeze_epochs: 5  # Longer freeze for stability with noisy labels
warmup_epochs: 3

# Regularization
label_smoothing: 0.1  # Higher smoothing for noisy labels
augment_train: false

# Checkpointing
checkpoint_dir: checkpoints
save_freq: 5
resume: null

# Logging
log_dir: logs

# Device
device: cuda
max_text_length: 77
