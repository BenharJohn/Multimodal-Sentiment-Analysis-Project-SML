# CDAN Model Configuration for MVSA Sentiment Analysis
# Implements CDAN 2025 paper: "CLIP-driven attention network for multimodal sentiment analysis"
# Reference: The Journal of Supercomputing, May 2025 - 78.5% accuracy on MVSA-Single

# Experiment
experiment_name: cdan_mvsa
seed: 42

# Data
dataset_type: single  # 'single' or 'multiple'
data_dir: data/processed
image_dir: data/raw/images
train_file: null  # Will use data_dir/train.csv if null
val_file: null    # Will use data_dir/val.csv if null
test_file: null   # Will use data_dir/test.csv if null
val_split: 0.1    # Used if val_file is null
test_split: 0.1   # Used if test_file is null

# Model Architecture
clip_model_name: openai/clip-vit-base-patch32
num_classes: 3
freeze_clip: true

# Cross-Attention (PROVEN: 2 layers work well)
cross_attn_layers: 2  # 2 layers is optimal - more causes overfitting
cross_attn_heads: 8
cross_attn_dropout: 0.1  # REVERTED to v1 setting (best performance)
cross_attn_ff_dim: 2048
pool_method: mean  # 'mean', 'max', or 'cls'

# Gating (PROVEN: simple gating works best)
use_gating: true
gate_type: simple  # 'simple' is stable and effective
gate_activation: sigmoid

# Auxiliary Decoder
use_aux_decoder: true
aux_loss_weight: 0.05  # Conservative weight
aux_loss_type: cosine
aux_num_layers: 2

# Classifier (PROVEN: these dimensions work)
classifier_hidden_dims: [512, 256]  # Original proven dimensions
classifier_dropout: 0.3  # REVERTED to v1 setting (best performance)

# Training
epochs: 50
batch_size: 32
num_workers: 4
pin_memory: true

# Optimization (RESEARCH-BACKED: smaller LR for CLIP fine-tuning)
lr: 0.001  # REVERTED to v1 setting (best performance)
clip_lr: 0.00002  # RESEARCH: 2e-5 to 3e-5 optimal for CLIP fine-tuning
weight_decay: 0.01  # REVERTED to v1 setting
optimizer: adamw
scheduler: cosine  # Simple cosine without warmup works fine
gradient_clip: 1.0

# CLIP Freezing Schedule
freeze_epochs: 3  # Original proven value
warmup_epochs: 2  # Not used with cosine scheduler

# Regularization (REVERTED to v1 + EMA from research)
label_smoothing: 0.0  # REVERTED to v1 - research shows it can hurt if not tuned
use_soft_labels: false
augment_train: false  # REVERTED to v1 - our augmentation hurt performance

# Focal Loss for Class Imbalance
# Class distribution: Positive=5638, Negative=601, Neutral=4065
# Weights calculated as inverse frequency normalized
use_focal_loss: true  # ENABLED - handles class imbalance
focal_gamma: 2.0  # Focusing parameter (higher = more focus on hard examples)
focal_alpha: [1.0, 9.4, 1.4]  # Class weights: [Pos, Neg, Neu] based on inverse freq

# =============================================================================
# DUAL ENCODER CONFIGURATION (CDAN 2025 Paper)
# =============================================================================
# Paper: "CLIP-driven attention network for multimodal sentiment analysis"
# Journal: The Journal of Supercomputing, May 2025
# Results: 78.5% accuracy on MVSA-Single
#
# Architecture: CLIP encoders + single-modality encoders (BERT + ResNet)
# with attention-based fusion for each modality
# =============================================================================
use_dual_encoders: true  # ENABLED - use CLIP + BERT/ResNet dual encoders
bert_model_name: bert-base-uncased  # BERT model for text auxiliary encoder
bert_max_length: 128  # Maximum BERT sequence length
resnet_model: resnet50  # ResNet model for image auxiliary encoder
freeze_aux_encoders: true  # Freeze BERT/ResNet initially (like CLIP)
use_decoder_feedback: true  # CDAN 2025: Feed decoder output back into fusion via self-adaptive aggregation

# Data Augmentation Settings (LIGHT augmentation only)
augmentation:
  image:
    random_resized_crop: false  # DISABLED - too aggressive
    crop_scale: [0.8, 1.0]
    horizontal_flip: true  # Keep - safe augmentation
    flip_prob: 0.5
    color_jitter: false  # DISABLED - may hurt sentiment recognition
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    random_rotation: false  # Keep disabled - may hurt sentiment
    rotation_degrees: 15
    gaussian_blur: false  # Keep disabled
    blur_prob: 0.1
  text:
    random_word_dropout: false  # DISABLED - may change meaning
    dropout_prob: 0.1
    random_word_swap: false  # Keep disabled - may change meaning
    swap_prob: 0.1

# Advanced Training
use_mixup: false  # DISABLED - causes instability
mixup_alpha: 0.2
use_gradient_accumulation: false
gradient_accumulation_steps: 1
use_ema: true  # ENABLED - RESEARCH: EMA reduces overfitting when fine-tuning pretrained models
ema_decay: 0.999  # Standard EMA decay rate

# Early Stopping
early_stopping: true  # ENABLED
patience: 15  # REVERTED to v1 setting
min_delta: 0.001

# Checkpointing
checkpoint_dir: checkpoints
save_freq: 10  # Less frequent saves
save_best_only: true  # Only save best model to reduce disk usage
resume: null

# Logging
log_dir: logs
log_attention_weights: false

# Device
device: cuda

# Text Processing
max_text_length: 77
