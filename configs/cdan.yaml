# CDAN Model Configuration for MVSA Sentiment Analysis
# OPTIMIZED FOR HIGHER ACCURACY

# Experiment
experiment_name: cdan_mvsa_optimized
seed: 42

# Data
dataset_type: single  # 'single' or 'multiple'
data_dir: data/processed
image_dir: data/raw/images
train_file: null  # Will use data_dir/train.csv if null
val_file: null    # Will use data_dir/val.csv if null
test_file: null   # Will use data_dir/test.csv if null
val_split: 0.1    # Used if val_file is null
test_split: 0.1   # Used if test_file is null

# Model Architecture
clip_model_name: openai/clip-vit-base-patch32
num_classes: 3
freeze_clip: true

# Cross-Attention (ENHANCED: more layers and heads for deeper fusion)
cross_attn_layers: 4  # Increased from 2 for deeper multimodal fusion
cross_attn_heads: 8
cross_attn_dropout: 0.15  # Slightly increased for regularization
cross_attn_ff_dim: 2048  # Explicit FFN dimension for cross-attention
pool_method: mean  # 'mean', 'max', or 'cls'

# Gating (ENHANCED: hierarchical gating for better modality weighting)
use_gating: true
gate_type: hierarchical  # Changed from 'simple' for better modality fusion
gate_activation: sigmoid  # 'sigmoid', 'softmax', or 'tanh'

# Auxiliary Decoder (ENHANCED: stronger regularization)
use_aux_decoder: true
aux_loss_weight: 0.1  # Increased from 0.05 for stronger regularization
aux_loss_type: cosine  # 'cosine', 'l2', 'l1', or 'smooth_l1'
aux_num_layers: 2

# Classifier (ENHANCED: wider hidden layers)
classifier_hidden_dims: [768, 384]  # Increased from [512, 256]
classifier_dropout: 0.25  # Reduced from 0.3 for less regularization in classifier

# Training (ENHANCED: more epochs for convergence)
epochs: 50  # Increased from 30 for better convergence
batch_size: 32
num_workers: 4
pin_memory: true

# Optimization (ENHANCED: tuned learning rates)
lr: 0.0008  # Slightly reduced for stability
clip_lr: 0.00002  # Slightly increased for better fine-tuning
weight_decay: 0.02  # Increased from 0.01 for regularization
optimizer: adamw  # 'adam', 'adamw', or 'sgd'
scheduler: cosine_warmup  # Changed to include warmup
gradient_clip: 1.0

# CLIP Freezing Schedule (ENHANCED: longer freeze period)
freeze_epochs: 5  # Increased from 3 for more stable initial training
warmup_epochs: 3  # Increased from 2 for smoother start
warmup_start_lr: 0.0001  # Starting LR for warmup

# Regularization (ENHANCED: enable label smoothing and augmentation)
label_smoothing: 0.1  # Enabled for noise robustness
use_soft_labels: false  # For MVSA-Multiple
augment_train: true  # ENABLED for better generalization

# Data Augmentation Settings (NEW)
augmentation:
  # Image augmentation
  image:
    random_resized_crop: true
    crop_scale: [0.8, 1.0]
    horizontal_flip: true
    flip_prob: 0.5
    color_jitter: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    random_rotation: true
    rotation_degrees: 15
    gaussian_blur: true
    blur_prob: 0.1
  # Text augmentation
  text:
    random_word_dropout: true
    dropout_prob: 0.1
    random_word_swap: true
    swap_prob: 0.1

# Advanced Training (NEW)
use_mixup: true  # Enable mixup augmentation
mixup_alpha: 0.2  # Mixup interpolation strength
use_gradient_accumulation: false
gradient_accumulation_steps: 2  # Effective batch size = batch_size * steps
use_ema: true  # Exponential moving average for model weights
ema_decay: 0.999

# Early Stopping (NEW)
early_stopping: true
patience: 10  # Stop if no improvement for N epochs
min_delta: 0.001  # Minimum improvement to count as progress

# Checkpointing
checkpoint_dir: checkpoints
save_freq: 5  # Save checkpoint every N epochs
save_best_only: true  # Only save best model
resume: null  # Path to checkpoint to resume from

# Logging
log_dir: logs
log_attention_weights: false  # Log attention maps for analysis

# Device
device: cuda  # 'cuda' or 'cpu'

# Text Processing
max_text_length: 77  # CLIP default
